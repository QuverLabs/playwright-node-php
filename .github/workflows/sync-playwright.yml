name: Sync Playwright documentation
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Dependabot branch to update
        type: string
        required: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tooling
          persist-credentials: false
      - name: Validate branch name
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          [[ "$TARGET_BRANCH" == dependabot/npm_and_yarn/* ]] && git check-ref-format --branch "$TARGET_BRANCH"
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          path: target
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Update README
        working-directory: target
        run: node ../tooling/scripts/sync-playwright-readme.mjs
      - name: Commit and push
        working-directory: target
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          if git diff --quiet -- README.md; then
            echo 'README is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update Playwright documentation'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
