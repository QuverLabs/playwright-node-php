name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: ['24.04', '26.04']
    uses: ./.github/workflows/build.yml
    with:
      ubuntu-version: ${{ matrix.ubuntu-version }}
